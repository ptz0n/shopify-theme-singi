name: Bug report
description: Something renders or behaves wrongly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A preview link, page type, settings and viewport help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: singi version or commit
  - type: input
    id: browser
    attributes:
      label: Browser and device
